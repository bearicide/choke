<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>*{box-sizing:border-box}body{margin:0;background:#040004;color:#39ff14;font-family:Bahnschrift,Arial,sans-serif;overflow:hidden}header,footer{padding:16px;border-bottom:3px solid #39ff14;background:#000}footer{border-top:3px solid #39ff14;border-bottom:none;font-size:1rem}header h1{margin:0;font-size:3rem;letter-spacing:.2rem}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:18px;height:calc(100vh - 240px);overflow:auto}.pad{background:#180018;border:4px solid #39ff14;padding:18px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;transition:.08s;border-radius:22px;box-shadow:0 0 18px rgba(57,255,20,.18)}.pad strong{font-size:1.4rem}.pad.active{border-color:#ff3c58;background:#320028;transform:scale(.98)}.pad.looping{border-color:#933dff;box-shadow:0 0 28px #933dff}.pad.queued{border-color:#59f3ff;box-shadow:0 0 22px #59f3ff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}button{padding:16px;font-size:1rem;background:#933dff;color:#fff;border:none;font-weight:bold;cursor:pointer;border-radius:12px}.green{background:#39ff14;color:#000}.red{background:#7a0000}.cyan{background:#59f3ff;color:#000}.panel{padding:14px;border-top:3px solid #39ff14;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:1.1rem}.vu{height:18px;background:linear-gradient(90deg,#39ff14,#ff3c58);margin:4px 0;width:180px}.overlord{display:none;padding:14px;border-top:3px solid #933dff;font-size:1.1rem}.overlord.open{display:block}input[type=file]{display:none}.importLabel{padding:16px;background:#39ff14;color:#000;font-weight:bold;cursor:pointer;border-radius:12px}#transport{display:flex;gap:14px;align-items:center;font-weight:bold;font-size:1.2rem}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}.pad{min-height:180px}header h1{font-size:2rem}}</style></head><body><header><h1>CHOKE</h1><div id='transport'>BPM 120 · STEP <span id='step'>0</span></div></header><div class='panel'><div>MASTER<div class='vu'></div></div><button id='hammer'>IMPACT HAMMER</button><button class='red' id='panic'>PANIC</button><button class='cyan' id='quantBtn'>1/16 QUANT</button><button id='adminBtn'>OVERLORD</button><label class='importLabel' for='fileInput'>IMPORT AUDIO</label><input id='fileInput' type='file' accept='audio/*' multiple></div><div id='grid'></div><div class='overlord' id='overlord'><h2>OVERLORD</h2><div id='status'>Awaiting imports...</div><div>Independent pad routing active.</div><div>Loop toggle fixed.</div></div><footer>bearicide.github.io</footer><script>const grid=document.getElementById('grid');const stepDisplay=document.getElementById('step');const keys=['q','w','e','r','a','s','d','f','z','x','c','v','1','2','3','4'];const padState=[];let audioCtx,master,hammer=false;let bpm=120;let step=0;let quant=16;let transportTimer;function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.9;master.connect(audioCtx.destination);startTransport()}function startTransport(){clearInterval(transportTimer);const interval=(60000/bpm)/(quant/4);transportTimer=setInterval(()=>{step=(step+1)%quant;stepDisplay.textContent=step;padState.forEach((p,index)=>{if(p.queued){triggerPad(index,p.loopQueued);p.queued=false;p.loopQueued=false;p.element.classList.remove('queued')}})},interval)}function stopSource(source){if(source){try{source.stop()}catch(e){}}}function panic(){padState.forEach(p=>{stopSource(p.loopSource);stopSource(p.oneShot);p.loopSource=null;p.oneShot=null;p.element.classList.remove('looping','queued')})}async function loadFile(file,index){init();const arrayBuffer=await file.arrayBuffer();const audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);padState[index].buffer=audioBuffer;padState[index].name.textContent=file.name;document.getElementById('status').innerHTML='Loaded: '+file.name}function createSource(index,loop=false){audioCtx.resume();const state=padState[index];if(!state.buffer)return null;const source=audioCtx.createBufferSource();const gain=audioCtx.createGain();const panner=audioCtx.createStereoPanner();source.buffer=state.buffer;source.loop=loop;gain.gain.value=hammer?1:.85;panner.pan.value=((index%4)-1.5)/1.5;source.connect(gain);gain.connect(panner);panner.connect(master);source.start();return source}function activate(index){const el=padState[index].element;el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120)}function triggerPad(index,loop=false){const state=padState[index];stopSource(state.oneShot);if(loop){if(state.loopSource)stopSource(state.loopSource);state.loopSource=createSource(index,true);state.element.classList.add('looping')}else{state.oneShot=createSource(index,false)}activate(index)}for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div><strong>'+keys[i].toUpperCase()+' · PAD '+(i+1)+'</strong><div class=name style="opacity:.7;font-size:1rem">no file loaded</div></div><div class=controls><button class=onBtn>ON</button><button class="green loopBtn">LOOP</button><button class=testBtn>QUEUE</button><button class="red offBtn">OFF</button></div>';const state={buffer:null,loopSource:null,oneShot:null,queued:false,loopQueued:false,element:pad,name:pad.querySelector('.name')};padState.push(state);pad.querySelector('.onBtn').onclick=(e)=>{e.stopPropagation();triggerPad(i,false)};pad.querySelector('.testBtn').onclick=(e)=>{e.stopPropagation();state.queued=true;state.loopQueued=false;pad.classList.add('queued')};pad.querySelector('.loopBtn').onclick=(e)=>{e.stopPropagation();if(state.loopSource){stopSource(state.loopSource);state.loopSource=null;pad.classList.remove('looping','queued')}else{state.queued=true;state.loopQueued=true;pad.classList.add('queued')}};pad.querySelector('.offBtn').onclick=(e)=>{e.stopPropagation();stopSource(state.oneShot);stopSource(state.loopSource);state.oneShot=null;state.loopSource=null;pad.classList.remove('looping','queued')};pad.addEventListener('pointerdown',()=>{state.queued=true;state.loopQueued=false;pad.classList.add('queued')});grid.appendChild(pad)}document.getElementById('fileInput').addEventListener('change',async(e)=>{const files=[...e.target.files];for(let i=0;i<files.length&&i<16;i++){await loadFile(files[i],i)}});document.addEventListener('keydown',e=>{const idx=keys.indexOf(e.key.toLowerCase());if(idx>-1){const state=padState[idx];state.queued=true;state.loopQueued=false;state.element.classList.add('queued')}if(e.code==='Space'){e.preventDefault();panic()}});document.getElementById('hammer').onclick=()=>hammer=!hammer;document.getElementById('panic').onclick=()=>panic();document.getElementById('adminBtn').onclick=()=>document.getElementById('overlord').classList.toggle('open');document.getElementById('quantBtn').onclick=()=>{quant=quant===16?8:quant===8?4:16;document.getElementById('quantBtn').innerHTML='1/'+quant+' QUANT';startTransport()};</script></body></html>
