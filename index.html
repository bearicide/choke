<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>*{box-sizing:border-box}body{margin:0;background:#050005;color:#39ff14;font-family:Arial,sans-serif;overflow:hidden}header,footer{padding:10px;border-bottom:2px solid #39ff14;background:#000}footer{border-top:2px solid #39ff14;border-bottom:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;height:calc(100vh - 140px);overflow:auto}.pad{background:#180018;border:3px solid #39ff14;padding:12px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;transition:.08s}.pad.active{border-color:#ff3c58;background:#320028;transform:scale(.98)}.pad.looping{border-color:#933dff;box-shadow:0 0 20px #933dff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}button{padding:10px;background:#933dff;color:#fff;border:none;font-weight:bold;cursor:pointer}.green{background:#39ff14;color:#000}.red{background:#7a0000}.panel{padding:10px;border-top:2px solid #39ff14;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.vu{height:14px;background:linear-gradient(90deg,#39ff14,#ff3c58);margin:4px 0;width:140px}.overlord{display:none;padding:10px;border-top:2px solid #933dff}.overlord.open{display:block}input[type=file]{display:none}.importLabel{padding:10px;background:#39ff14;color:#000;font-weight:bold;cursor:pointer}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>CHOKE</h1><div>BUFFER STATE PATCH ACTIVE</div></header><div class='panel'><div>MASTER<div class='vu'></div></div><button id='hammer'>IMPACT HAMMER</button><button class='red' id='panic'>PANIC</button><button id='adminBtn'>OVERLORD</button><label class='importLabel' for='fileInput'>IMPORT AUDIO</label><input id='fileInput' type='file' accept='audio/*' multiple></div><div id='grid'></div><div class='overlord' id='overlord'><h2>OVERLORD</h2><div id='status'>Awaiting imports...</div></div><footer>bearicide.github.io</footer><script>const grid=document.getElementById('grid');const names=['LOAD','SLAM','GLITCH','VOID','BASS','SYNTH','VOICE','STATIC','CHOP','REVERSE','TAPE','FREEZE','CHOKE','PANIC','BURN','OVERLOAD'];const keys=['q','w','e','r','a','s','d','f','z','x','c','v','1','2','3','4'];const padState=[];let audioCtx,master,hammer=false;function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination)}function stopSource(source){if(source){try{source.stop()}catch(e){}}}function panic(){padState.forEach(p=>{stopSource(p.loopSource);stopSource(p.oneShot);p.loopSource=null;p.oneShot=null;p.element.classList.remove('looping')})}async function loadFile(file,index){init();const arrayBuffer=await file.arrayBuffer();const audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);padState[index].buffer=audioBuffer;padState[index].name.textContent=file.name;document.getElementById('status').innerHTML='Loaded: '+file.name}function createSource(index,loop=false){init();audioCtx.resume();const state=padState[index];if(!state.buffer)return null;const source=audioCtx.createBufferSource();const gain=audioCtx.createGain();source.buffer=state.buffer;source.loop=loop;gain.gain.value=hammer?1:.8;source.connect(gain);gain.connect(master);source.start();return source}function activate(index){const el=padState[index].element;el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120)}for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div><strong>'+keys[i].toUpperCase()+' · PAD '+(i+1)+'</strong><div class=name style="opacity:.7">no file loaded</div></div><div class=controls><button class=onBtn>ON</button><button class="green loopBtn">LOOP</button><button class=testBtn>TEST</button><button class="red offBtn">OFF</button></div>';const state={buffer:null,loopSource:null,oneShot:null,element:pad,name:pad.querySelector('.name')};padState.push(state);pad.querySelector('.onBtn').onclick=(e)=>{e.stopPropagation();stopSource(state.oneShot);state.oneShot=createSource(i,false);activate(i)};pad.querySelector('.testBtn').onclick=(e)=>{e.stopPropagation();stopSource(state.oneShot);state.oneShot=createSource(i,false);activate(i)};pad.querySelector('.loopBtn').onclick=(e)=>{e.stopPropagation();if(state.loopSource){stopSource(state.loopSource);state.loopSource=null;pad.classList.remove('looping')}else{state.loopSource=createSource(i,true);pad.classList.add('looping')}activate(i)};pad.querySelector('.offBtn').onclick=(e)=>{e.stopPropagation();stopSource(state.oneShot);stopSource(state.loopSource);state.oneShot=null;state.loopSource=null;pad.classList.remove('looping')};pad.addEventListener('pointerdown',()=>{stopSource(state.oneShot);state.oneShot=createSource(i,false);activate(i)});grid.appendChild(pad)}document.getElementById('fileInput').addEventListener('change',async(e)=>{const files=[...e.target.files];for(let i=0;i<files.length&&i<16;i++){await loadFile(files[i],i)}});document.addEventListener('keydown',e=>{const idx=keys.indexOf(e.key.toLowerCase());if(idx>-1){const state=padState[idx];stopSource(state.oneShot);state.oneShot=createSource(idx,false);activate(idx)}if(e.code==='Space'){e.preventDefault();panic()}});document.getElementById('hammer').onclick=()=>hammer=!hammer;document.getElementById('panic').onclick=()=>panic();document.getElementById('adminBtn').onclick=()=>document.getElementById('overlord').classList.toggle('open');</script></body></html>
