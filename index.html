<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#63ff8f;font-family:Bahnschrift,Arial,sans-serif}header{padding:16px 20px;background:#000;border-bottom:3px solid #1aff73}h1{margin:0;font-size:3rem}#toolbar{display:flex;gap:10px;padding:14px;background:#07110b;border-bottom:2px solid #123;flex-wrap:wrap}button,input,label{padding:14px 16px;background:#08110b;color:#63ff8f;border:2px solid #1aff73;border-radius:12px;font-weight:700}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:18px}.pad{background:#101510;border:3px solid #1aff73;border-radius:20px;padding:16px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.pad.active{border-color:#ff3355}.pad.looping{border-color:#8a2eff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{padding:14px;border:none}.trig{background:#1aff73;color:#000}.loop{background:#8a2eff;color:#fff}.stop{background:#8b1026;color:#fff}.wave{height:40px;background:#041008;border-radius:10px;margin-top:10px;border:1px solid rgba(0,255,120,.2)}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}h1{font-size:2rem}}</style></head><body><header><h1>CHOKE</h1></header><div id='toolbar'><button id='panic'>PANIC</button><label for='audio'>IMPORT AUDIO</label><input id='audio' type='file' accept='audio/*'><input value='120'></div><div id='grid'></div><script>const grid=document.getElementById('grid');for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div><strong>PAD '+(i+1)+'</strong><div class=wave></div></div><div class=controls><button class=trig>TRIG</button><button class=loop>LOOP</button><button class=stop>STOP</button></div>';grid.appendChild(pad);const trig=pad.querySelector('.trig');const loop=pad.querySelector('.loop');const stop=pad.querySelector('.stop');trig.onclick=()=>{document.querySelectorAll('.pad').forEach(p=>p.classList.remove('active'));pad.classList.add('active')};loop.onclick=()=>pad.classList.toggle('looping');stop.onclick=()=>{pad.classList.remove('active');pad.classList.remove('looping')}}document.getElementById('panic').onclick=()=>document.querySelectorAll('.pad').forEach(p=>p.classList.remove('active','looping'));</script></body></html>
