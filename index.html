<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>*{box-sizing:border-box}body{margin:0;background:#050008;color:#6dff57;font-family:Bahnschrift,Arial,sans-serif;overflow:hidden}header,footer{padding:18px;background:#000;border-bottom:4px solid #6dff57}footer{border-top:4px solid #6dff57;border-bottom:none;text-align:center;font-size:1rem}header h1{margin:0;font-size:3.2rem;letter-spacing:.2rem}#transport{font-size:1.2rem;font-weight:bold;margin-top:6px}.toolbar{display:flex;gap:14px;flex-wrap:wrap;padding:14px;border-bottom:3px solid #222;background:#0b0010}.toolbar button,.importLabel{padding:18px 24px;border:none;border-radius:16px;font-weight:900;font-size:1rem;cursor:pointer}.toolbar button{background:#8a2eff;color:white}.panic{background:#a00020!important}.importLabel{background:#6dff57;color:black}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:18px;height:calc(100vh - 235px);overflow:auto}.pad{background:linear-gradient(180deg,#1a001d,#240028);border:4px solid #6dff57;border-radius:24px;padding:18px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 18px rgba(109,255,87,.18)}.padHeader strong{font-size:1.5rem;display:block}.sliceInfo{font-size:1rem;opacity:.7;margin-top:8px}.pad.active{border-color:#ff3355;background:#3a0024}.pad.looping{border-color:#8a2eff;box-shadow:0 0 26px #8a2eff}.pad.queued{border-color:#59f3ff;box-shadow:0 0 24px #59f3ff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.controls button{padding:18px;border:none;border-radius:14px;font-size:1rem;font-weight:900}.triggerBtn{background:#6dff57;color:black}.loopBtn{background:#8a2eff;color:white}.queueBtn{background:#59f3ff;color:black}.stopBtn{background:#8d001a;color:white}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}.pad{min-height:200px}header h1{font-size:2rem}}</style></head><body><header><h1>CHOKE</h1><div id='transport'>BPM 120 · STEP <span id='step'>0</span></div></header><div class='toolbar'><button id='quantBtn'>1/16 QUANT</button><button id='hammerBtn'>IMPACT</button><button class='panic' id='panicBtn'>PANIC</button><label class='importLabel' for='audioImport'>IMPORT + SLICE</label><input id='audioImport' type='file' accept='audio/*'></div><div id='grid'></div><footer>bearicide.github.io</footer><script>const grid=document.getElementById('grid');const stepDisplay=document.getElementById('step');const keys=['Q','W','E','R','A','S','D','F','Z','X','C','V','1','2','3','4'];const pads=[];let ctx,master,bpm=120,step=0,quant=16,timer,hammer=false;function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);startClock()}function startClock(){clearInterval(timer);const interval=(60000/bpm)/(quant/4);timer=setInterval(()=>{step=(step+1)%quant;stepDisplay.textContent=step;pads.forEach((p,i)=>{if(p.queued){playPad(i,p.loopQueued);p.queued=false;p.loopQueued=false;p.el.classList.remove('queued')}})},interval)}function stop(src){if(src){try{src.stop()}catch(e){}}}function panic(){pads.forEach(p=>{stop(p.loopSource);stop(p.oneShot);p.loopSource=null;p.oneShot=null;p.el.classList.remove('looping','queued')})}function activate(el){el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120)}function createSource(buffer,index,loop=false){if(!buffer)return null;const source=ctx.createBufferSource();const gain=ctx.createGain();const pan=ctx.createStereoPanner();source.buffer=buffer;source.loop=loop;gain.gain.value=hammer?1:.85;pan.pan.value=((index%4)-1.5)/1.5;source.connect(gain);gain.connect(pan);pan.connect(master);source.start();return source}function playPad(index,loop=false){const p=pads[index];if(!p.buffer)return;if(loop){if(p.loopSource){stop(p.loopSource);p.loopSource=null;p.el.classList.remove('looping');return}p.loopSource=createSource(p.buffer,index,true);p.el.classList.add('looping')}else{stop(p.oneShot);p.oneShot=createSource(p.buffer,index,false)}activate(p.el)}async function sliceAudio(file){initAudio();const data=await file.arrayBuffer();const decoded=await ctx.decodeAudioData(data);const sliceLength=decoded.duration/16;for(let i=0;i<16;i++){const frameCount=Math.floor(decoded.sampleRate*sliceLength);const sliceBuffer=ctx.createBuffer(decoded.numberOfChannels,frameCount,decoded.sampleRate);for(let ch=0;ch<decoded.numberOfChannels;ch++){const sourceData=decoded.getChannelData(ch);const sliceData=sliceBuffer.getChannelData(ch);const start=Math.floor(i*sliceLength*decoded.sampleRate);for(let j=0;j<frameCount;j++){sliceData[j]=sourceData[start+j]||0}}pads[i].buffer=sliceBuffer;pads[i].sliceInfo.textContent='slice '+(i+1)+' loaded'}}for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div class=padHeader><strong>'+keys[i]+' · PAD '+(i+1)+'</strong><div class=sliceInfo>awaiting slice</div></div><div class=controls><button class=triggerBtn>TRIGGER</button><button class=loopBtn>LOOP</button><button class=queueBtn>QUEUE</button><button class=stopBtn>STOP</button></div>';const state={buffer:null,loopSource:null,oneShot:null,queued:false,loopQueued:false,el:pad,sliceInfo:pad.querySelector('.sliceInfo')};pads.push(state);pad.querySelector('.triggerBtn').onclick=()=>playPad(i,false);pad.querySelector('.loopBtn').onclick=()=>playPad(i,true);pad.querySelector('.queueBtn').onclick=()=>{state.queued=true;state.loopQueued=false;pad.classList.add('queued')};pad.querySelector('.stopBtn').onclick=()=>{stop(state.loopSource);stop(state.oneShot);state.loopSource=null;state.oneShot=null;pad.classList.remove('looping','queued')};grid.appendChild(pad)}document.getElementById('audioImport').addEventListener('change',async e=>{const file=e.target.files[0];if(file)await sliceAudio(file)});document.getElementById('panicBtn').onclick=panic;document.getElementById('hammerBtn').onclick=()=>hammer=!hammer;document.getElementById('quantBtn').onclick=()=>{quant=quant===16?8:quant===8?4:16;document.getElementById('quantBtn').innerHTML='1/'+quant+' QUANT';startClock()};document.addEventListener('keydown',e=>{const idx=keys.map(k=>k.toLowerCase()).indexOf(e.key.toLowerCase());if(idx>-1)playPad(idx,false);if(e.code==='Space'){e.preventDefault();panic()}});</script></body></html>
