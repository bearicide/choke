<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE // OVERLORD</title><style>*{box-sizing:border-box}body{margin:0;color:#65ff8f;font-family:Bahnschrift,Arial,sans-serif;overflow:hidden;background:#030303;background-image:radial-gradient(circle at top,#0f331d,#020202 60%)}body:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,120,.03) 0px,rgba(0,255,120,.03) 1px,transparent 2px,transparent 4px);pointer-events:none;mix-blend-mode:screen}header{padding:18px 24px;border-bottom:3px solid #1aff73;background:rgba(0,0,0,.88);box-shadow:0 0 20px rgba(0,255,100,.15)}header h1{margin:0;font-size:3.5rem;letter-spacing:.25rem;text-shadow:0 0 12px #1aff73}#transport{margin-top:6px;font-size:1.1rem;font-weight:bold;opacity:.8}.toolbar{display:flex;gap:14px;flex-wrap:wrap;padding:18px;background:#07110b;border-bottom:2px solid #123}.toolbar button,.importLabel{background:linear-gradient(180deg,#112017,#08100b);border:2px solid #1aff73;color:#65ff8f;padding:18px 24px;border-radius:18px;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 0 16px rgba(0,255,100,.08)}.panic{border-color:#ff3355;color:#ff6688}.importLabel{display:flex;align-items:center}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:22px;height:calc(100vh - 220px);overflow:auto}.pad{position:relative;background:linear-gradient(180deg,#0f1612,#09100c);border:3px solid #1aff73;border-radius:28px;padding:20px;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 0 24px rgba(0,255,120,.08), inset 0 0 24px rgba(0,255,120,.04)}.pad:before{content:'';position:absolute;inset:0;border:1px solid rgba(0,255,120,.18);border-radius:24px;pointer-events:none}.padHeader strong{font-size:1.6rem;display:block;letter-spacing:.08rem}.sliceInfo{margin-top:8px;font-size:1rem;opacity:.7}.wave{height:42px;border:1px solid rgba(0,255,120,.2);border-radius:12px;margin-top:14px;background:linear-gradient(90deg,transparent,rgba(0,255,120,.2),transparent)}.pad.active{border-color:#ff3355;box-shadow:0 0 26px rgba(255,60,90,.45)}.pad.looping{border-color:#9d4dff;box-shadow:0 0 26px rgba(157,77,255,.45)}.pad.queued{border-color:#59f3ff;box-shadow:0 0 26px rgba(89,243,255,.45)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.controls button{padding:18px;border-radius:14px;font-size:1rem;font-weight:900;border:none;cursor:pointer}.triggerBtn{background:#1aff73;color:#00150a}.loopBtn{background:#8a2eff;color:white}.queueBtn{background:#59f3ff;color:#001118}.stopBtn{background:#8b1026;color:white}footer{padding:14px;text-align:center;border-top:2px solid #1aff73;background:#000;color:#4eff86;font-size:1rem;letter-spacing:.12rem}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:2.2rem}.pad{min-height:220px}}</style></head><body><header><h1>CHOKE</h1><div id='transport'>OVERLORD TRANSPORT // BPM 120 // STEP <span id='step'>0</span></div></header><div class='toolbar'><button id='quantBtn'>QUANT</button><button id='hammerBtn'>IMPACT</button><button class='panic' id='panicBtn'>PANIC</button><label class='importLabel' for='audioImport'>IMPORT + SLICE</label><input id='audioImport' type='file' accept='audio/*'></div><div id='grid'></div><footer>MATTBEAR // OVERLORD INTERFACE // CONTROL IS NOT GIVEN.</footer><script>const grid=document.getElementById('grid');const stepDisplay=document.getElementById('step');const keys=['Q','W','E','R','A','S','D','F','Z','X','C','V','1','2','3','4'];const pads=[];let ctx,master,bpm=120,step=0,quant=16,timer,hammer=false;function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);startClock()}function startClock(){clearInterval(timer);const interval=(60000/bpm)/(quant/4);timer=setInterval(()=>{step=(step+1)%quant;stepDisplay.textContent=step;pads.forEach((p,i)=>{if(p.queued){playPad(i,p.loopQueued);p.queued=false;p.loopQueued=false;p.el.classList.remove('queued')}})},interval)}function stop(src){if(src){try{src.stop()}catch(e){}}}function panic(){pads.forEach(p=>{stop(p.loopSource);stop(p.oneShot);p.loopSource=null;p.oneShot=null;p.el.classList.remove('looping','queued')})}function activate(el){el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120)}function createSource(buffer,index,loop=false){if(!buffer)return null;const source=ctx.createBufferSource();const gain=ctx.createGain();const pan=ctx.createStereoPanner();source.buffer=buffer;source.loop=loop;gain.gain.value=hammer?1:.85;pan.pan.value=((index%4)-1.5)/1.5;source.connect(gain);gain.connect(pan);pan.connect(master);source.start();return source}function playPad(index,loop=false){const p=pads[index];if(!p.buffer)return;if(loop){if(p.loopSource){stop(p.loopSource);p.loopSource=null;p.el.classList.remove('looping');return}p.loopSource=createSource(p.buffer,index,true);p.el.classList.add('looping')}else{stop(p.oneShot);p.oneShot=createSource(p.buffer,index,false)}activate(p.el)}async function sliceAudio(file){initAudio();const data=await file.arrayBuffer();const decoded=await ctx.decodeAudioData(data);const sliceLength=decoded.duration/16;for(let i=0;i<16;i++){const frameCount=Math.floor(decoded.sampleRate*sliceLength);const sliceBuffer=ctx.createBuffer(decoded.numberOfChannels,frameCount,decoded.sampleRate);for(let ch=0;ch<decoded.numberOfChannels;ch++){const sourceData=decoded.getChannelData(ch);const sliceData=sliceBuffer.getChannelData(ch);const start=Math.floor(i*sliceLength*decoded.sampleRate);for(let j=0;j<frameCount;j++){sliceData[j]=sourceData[start+j]||0}}pads[i].buffer=sliceBuffer;pads[i].sliceInfo.textContent='SLICE '+(i+1)+' READY'}}for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div class=padHeader><strong>'+keys[i]+' // PAD '+(i+1)+'</strong><div class=sliceInfo>NO SLICE</div><div class=wave></div></div><div class=controls><button class=triggerBtn>TRIGGER</button><button class=loopBtn>LOOP</button><button class=queueBtn>QUEUE</button><button class=stopBtn>STOP</button></div>';const state={buffer:null,loopSource:null,oneShot:null,queued:false,loopQueued:false,el:pad,sliceInfo:pad.querySelector('.sliceInfo')};pads.push(state);pad.querySelector('.triggerBtn').onclick=()=>playPad(i,false);pad.querySelector('.loopBtn').onclick=()=>playPad(i,true);pad.querySelector('.queueBtn').onclick=()=>{state.queued=true;state.loopQueued=false;pad.classList.add('queued')};pad.querySelector('.stopBtn').onclick=()=>{stop(state.loopSource);stop(state.oneShot);state.loopSource=null;state.oneShot=null;pad.classList.remove('looping','queued')};grid.appendChild(pad)}document.getElementById('audioImport').addEventListener('change',async e=>{const file=e.target.files[0];if(file)await sliceAudio(file)});document.getElementById('panicBtn').onclick=panic;document.getElementById('hammerBtn').onclick=()=>hammer=!hammer;document.getElementById('quantBtn').onclick=()=>{quant=quant===16?8:quant===8?4:16;document.getElementById('quantBtn').innerHTML='1/'+quant;startClock()};document.addEventListener('keydown',e=>{const idx=keys.map(k=>k.toLowerCase()).indexOf(e.key.toLowerCase());if(idx>-1)playPad(idx,false);if(e.code==='Space'){e.preventDefault();panic()}});</script></body></html>
