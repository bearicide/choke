<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>*{box-sizing:border-box}body{margin:0;background:#050005;color:#39ff14;font-family:Arial,sans-serif;overflow:hidden}header,footer{padding:10px;border-bottom:2px solid #39ff14;background:#000}footer{border-top:2px solid #39ff14;border-bottom:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;height:calc(100vh - 120px);overflow:auto}.pad{background:#180018;border:3px solid #39ff14;padding:12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:.08s}.pad.active{border-color:#ff3c58;background:#320028;transform:scale(.98)}.pad.looping{border-color:#933dff;box-shadow:0 0 20px #933dff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}button{padding:10px;background:#933dff;color:#fff;border:none;font-weight:bold;cursor:pointer}.green{background:#39ff14;color:#000}.red{background:#7a0000}.panel{padding:10px;border-top:2px solid #39ff14;display:flex;gap:10px;flex-wrap:wrap}.vu{height:14px;background:linear-gradient(90deg,#39ff14,#ff3c58);margin:4px 0;width:140px}.overlord{display:none;padding:10px;border-top:2px solid #933dff}.overlord.open{display:block}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>CHOKE</h1><div>BPM 128 / GLOBAL CHOKE / DYNAMIC PACKS</div></header><div class='panel'><div>MASTER<div class='vu'></div></div><button id='hammer'>IMPACT HAMMER</button><button class='red' id='panic'>PANIC</button><button id='adminBtn'>OVERLORD</button></div><div id='grid'></div><div class='overlord' id='overlord'><h2>OVERLORD</h2><div>Latency Debug</div><div>Touch Safe Mode</div><div>Pack Routing</div><div>Visual Intensity</div></div><footer>bearicide.github.io</footer><script>const grid=document.getElementById('grid');const pads=[];const names=['LOAD','SLAM','GLITCH','VOID','BASS','SYNTH','VOICE','STATIC','CHOP','REVERSE','TAPE','FREEZE','CHOKE','PANIC','BURN','OVERLOAD'];const keys=['q','w','e','r','a','s','d','f','z','x','c','v','1','2','3','4'];let audioCtx,master,hammer=false,active=[];function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.35;master.connect(audioCtx.destination)}function choke(){active.forEach(a=>{try{a.stop()}catch(e){}});active=[]}function fireTone(i,long=false){init();audioCtx.resume();choke();const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=hammer?'sawtooth':'square';osc.frequency.value=80+(i*40);gain.gain.setValueAtTime(hammer?.6:.3,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(long?.8:.2));osc.connect(gain);gain.connect(master);osc.start();osc.stop(audioCtx.currentTime+(long?.8:.2));active.push(osc)}function activatePad(i){const pad=pads[i];pad.classList.add('active');setTimeout(()=>pad.classList.remove('active'),120)}for(let i=0;i<16;i++){const p=document.createElement('div');p.className='pad';p.innerHTML='<div><strong>'+keys[i].toUpperCase()+' · '+names[i]+'</strong><div style="opacity:.7">dynamic routing active</div></div><div class=controls><button class=onBtn>ON</button><button class="green loopBtn">LOOP</button><button class=testBtn>TEST</button><button class="red offBtn">OFF</button></div>';const onBtn=p.querySelector('.onBtn');const loopBtn=p.querySelector('.loopBtn');const testBtn=p.querySelector('.testBtn');const offBtn=p.querySelector('.offBtn');onBtn.onclick=(e)=>{e.stopPropagation();fireTone(i,true);activatePad(i)};testBtn.onclick=(e)=>{e.stopPropagation();fireTone(i,false);activatePad(i)};loopBtn.onclick=(e)=>{e.stopPropagation();p.classList.toggle('looping');if(p.classList.contains('looping')){fireTone(i,true)}else{choke()}};offBtn.onclick=(e)=>{e.stopPropagation();p.classList.remove('looping');choke()};p.addEventListener('pointerdown',()=>{fireTone(i,false);activatePad(i)});grid.appendChild(p);pads.push(p)}document.addEventListener('keydown',e=>{const idx=keys.indexOf(e.key.toLowerCase());if(idx>-1){fireTone(idx,false);activatePad(idx)}if(e.code==='Space'){e.preventDefault();choke()}});document.getElementById('hammer').onclick=()=>hammer=!hammer;document.getElementById('panic').onclick=()=>{choke();pads.forEach(p=>p.classList.remove('looping'))};document.getElementById('adminBtn').onclick=()=>document.getElementById('overlord').classList.toggle('open');</script></body></html>
