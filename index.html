<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE // OVERLORD</title><style>*{box-sizing:border-box}body{margin:0;color:#65ff8f;font-family:Bahnschrift,Arial,sans-serif;overflow:hidden;background:#030303;background-image:radial-gradient(circle at top,#0f331d,#020202 60%)}body:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,120,.03) 0px,rgba(0,255,120,.03) 1px,transparent 2px,transparent 4px);pointer-events:none}header{padding:18px 24px;border-bottom:3px solid #1aff73;background:rgba(0,0,0,.9)}header h1{margin:0;font-size:3.5rem;letter-spacing:.25rem;text-shadow:0 0 12px #1aff73}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:16px;background:#07110b;border-bottom:2px solid #123}.toolbar button,.importLabel,.toolbar input{background:#08110b;border:2px solid #1aff73;color:#65ff8f;padding:16px 20px;border-radius:16px;font-weight:900}.toolbar input{width:90px}.panic{border-color:#ff3355;color:#ff6688}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:22px;height:calc(100vh - 220px);overflow:auto}.pad{background:linear-gradient(180deg,#0f1612,#09100c);border:3px solid #1aff73;border-radius:28px;padding:20px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 24px rgba(0,255,120,.08)}.pad.active{border-color:#ff3355}.pad.looping{border-color:#9d4dff}.pad.queued{border-color:#59f3ff}.pad.choked{border-color:#ff003c;box-shadow:0 0 28px rgba(255,0,60,.55)}.padHeader strong{font-size:1.5rem}.sliceInfo{opacity:.75;margin-top:8px}.wave{height:50px;border-radius:10px;margin-top:12px;background:#041008;border:1px solid rgba(0,255,120,.2);position:relative;overflow:hidden}.wavebar{position:absolute;bottom:0;width:4px;background:#1aff73;opacity:.75}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.controls button{padding:18px;border:none;border-radius:14px;font-weight:900}.triggerBtn{background:#1aff73;color:#00150a}.loopBtn{background:#8a2eff;color:white}.queueBtn{background:#59f3ff;color:#001118}.stopBtn{background:#8b1026;color:white}footer{padding:14px;text-align:center;border-top:2px solid #1aff73;background:#000}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:2.2rem}}</style></head><body><header><h1>CHOKE</h1><div id='transport'>GLOBAL CHOKE BUS // BPM <span id='bpmReadout'>120</span> // STEP <span id='step'>0</span></div></header><div class='toolbar'><button id='quantBtn'>1/16</button><input id='bpmInput' type='number' min='40' max='240' value='120'><button id='chokeToggle'>FULL CHOKE: ON</button><button class='panic' id='panicBtn'>PANIC</button><label class='importLabel' for='audioImport'>IMPORT + SLICE</label><input id='audioImport' type='file' accept='audio/*'></div><div id='grid'></div><footer>MATTBEAR // OVERLORD INTERFACE</footer><script>const grid=document.getElementById('grid');const stepDisplay=document.getElementById('step');const bpmReadout=document.getElementById('bpmReadout');const keys=['Q','W','E','R','A','S','D','F','Z','X','C','V','1','2','3','4'];const pads=[];let ctx,master,bpm=120,step=0,quant=16,timer,fullChoke=true;function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination);startClock()}function startClock(){clearInterval(timer);const interval=(60000/bpm)/(quant/4);timer=setInterval(()=>{step=(step+1)%quant;stepDisplay.textContent=step;pads.forEach((p,i)=>{if(p.queued){playPad(i,p.loopQueued);p.queued=false;p.loopQueued=false;p.el.classList.remove('queued')}})},interval)}function stop(src){if(src){try{src.stop()}catch(e){}}}function chokeOthers(activeIndex){pads.forEach((p,i)=>{if(i!==activeIndex){stop(p.loopSource);stop(p.oneShot);p.loopSource=null;p.oneShot=null;p.el.classList.remove('looping');p.el.classList.add('choked');setTimeout(()=>p.el.classList.remove('choked'),140)}})}function panic(){pads.forEach(p=>{stop(p.loopSource);stop(p.oneShot);p.loopSource=null;p.oneShot=null;p.el.classList.remove('looping','queued')})}function activate(el){el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120)}function createSource(buffer,index,loop=false){if(!buffer)return null;const source=ctx.createBufferSource();const gain=ctx.createGain();const pan=ctx.createStereoPanner();source.buffer=buffer;source.loop=loop;pan.pan.value=((index%4)-1.5)/1.5;source.connect(gain);gain.connect(pan);pan.connect(master);source.start();return source}function drawWaveform(waveEl,data){waveEl.innerHTML='';const step=Math.floor(data.length/48);for(let i=0;i<48;i++){const val=Math.abs(data[i*step]||0);const bar=document.createElement('div');bar.className='wavebar';bar.style.left=(i*2.1)+'%';bar.style.height=Math.max(6,val*100)+'%';waveEl.appendChild(bar)}}function playPad(index,loop=false){const p=pads[index];if(!p.buffer)return;if(fullChoke)chokeOthers(index);if(loop){if(p.loopSource){stop(p.loopSource);p.loopSource=null;p.el.classList.remove('looping');return}p.loopSource=createSource(p.buffer,index,true);p.el.classList.add('looping')}else{stop(p.oneShot);p.oneShot=createSource(p.buffer,index,false)}activate(p.el)}async function sliceAudio(file){initAudio();const data=await file.arrayBuffer();const decoded=await ctx.decodeAudioData(data);const sourceData=decoded.getChannelData(0);const slicePoints=[];const chunk=Math.floor(sourceData.length/64);for(let i=0;i<64;i++){let peak=0;let peakIndex=i*chunk;for(let j=0;j<chunk;j++){const v=Math.abs(sourceData[(i*chunk)+j]||0);if(v>peak){peak=v;peakIndex=(i*chunk)+j}}slicePoints.push(peakIndex)}for(let i=0;i<16;i++){const start=slicePoints[i*4]||0;const end=slicePoints[(i*4)+4]||sourceData.length-1;const frameCount=Math.max(1,end-start);const sliceBuffer=ctx.createBuffer(decoded.numberOfChannels,frameCount,decoded.sampleRate);for(let ch=0;ch<decoded.numberOfChannels;ch++){const chData=decoded.getChannelData(ch);const slice=sliceBuffer.getChannelData(ch);for(let j=0;j<frameCount;j++){slice[j]=chData[start+j]||0}}pads[i].buffer=sliceBuffer;pads[i].sliceInfo.textContent='CHOKE SLICE '+(i+1);drawWaveform(pads[i].wave,sliceBuffer.getChannelData(0))}}for(let i=0;i<16;i++){const pad=document.createElement('div');pad.className='pad';pad.innerHTML='<div class=padHeader><strong>'+keys[i]+' // PAD '+(i+1)+'</strong><div class=sliceInfo>NO SLICE</div><div class=wave></div></div><div class=controls><button class=triggerBtn>TRIGGER</button><button class=loopBtn>LOOP</button><button class=queueBtn>QUEUE</button><button class=stopBtn>STOP</button></div>';const state={buffer:null,loopSource:null,oneShot:null,queued:false,loopQueued:false,el:pad,wave:pad.querySelector('.wave'),sliceInfo:pad.querySelector('.sliceInfo')};pads.push(state);pad.querySelector('.triggerBtn').onclick=()=>playPad(i,false);pad.querySelector('.loopBtn').onclick=()=>playPad(i,true);pad.querySelector('.queueBtn').onclick=()=>{state.queued=true;state.loopQueued=false;pad.classList.add('queued')};pad.querySelector('.stopBtn').onclick=()=>{stop(state.loopSource);stop(state.oneShot);state.loopSource=null;state.oneShot=null;pad.classList.remove('looping','queued')};grid.appendChild(pad)}document.getElementById('audioImport').addEventListener('change',async e=>{const file=e.target.files[0];if(file)await sliceAudio(file)});document.getElementById('panicBtn').onclick=panic;document.getElementById('quantBtn').onclick=()=>{quant=quant===16?8:quant===8?4:16;document.getElementById('quantBtn').innerHTML='1/'+quant;startClock()};document.getElementById('bpmInput').onchange=e=>{bpm=parseInt(e.target.value)||120;bpmReadout.textContent=bpm;startClock()};document.getElementById('chokeToggle').onclick=e=>{fullChoke=!fullChoke;e.target.innerHTML='FULL CHOKE: '+(fullChoke?'ON':'OFF')};document.addEventListener('keydown',e=>{const idx=keys.map(k=>k.toLowerCase()).indexOf(e.key.toLowerCase());if(idx>-1)playPad(idx,false);if(e.code==='Space'){e.preventDefault();panic()}});</script></body></html>
