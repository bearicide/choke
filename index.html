<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHOKE — BY MATTBEAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#060006;font-family:'Teko',sans-serif;color:#39ff14;touch-action:manipulation}
body{display:flex;flex-direction:column;background:radial-gradient(circle at top,#250038 0%,#090009 55%,#000 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:1vh 1vw;border-bottom:3px solid #39ff14;background:rgba(0,0,0,.45);box-shadow:0 0 30px rgba(57,255,20,.15)}
.logo{font-size:clamp(2rem,5vw,5rem);letter-spacing:.15em;color:#b84dff;text-shadow:0 0 20px #b84dff}
.status{display:flex;gap:1rem;font-size:clamp(1rem,2vw,2rem)}
.waveform{height:14vh;margin:1vh 1vw;border:4px solid #8b31ff;background:linear-gradient(180deg,#120018,#000);position:relative;overflow:hidden;box-shadow:0 0 35px rgba(139,49,255,.35)}
.waveform::after{content:'DROP FILES IN. THE MACHINE FIGURES IT OUT.';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.1rem,2vw,3rem);letter-spacing:.12em;color:rgba(57,255,20,.75);text-shadow:0 0 18px #39ff14}
.main{flex:1;display:grid;grid-template-columns:1fr 300px;gap:1vh;padding:1vh 1vw;min-height:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vh;min-height:0}
.pad{background:linear-gradient(180deg,#220028,#0c000f);border:4px solid #39ff14;display:flex;flex-direction:column;justify-content:space-between;padding:.6rem;box-shadow:0 0 20px rgba(57,255,20,.18),inset 0 0 15px rgba(184,77,255,.15);transition:.08s;clip-path:polygon(5% 0,100% 0,100% 86%,94% 100%,0 100%,0 14%)}
.pad.active{transform:scale(.985);background:linear-gradient(180deg,#3d0052,#18001f);box-shadow:0 0 35px rgba(57,255,20,.45),0 0 12px rgba(184,77,255,.45)}
.pad-title{font-size:clamp(1.1rem,2vw,2.4rem);letter-spacing:.08em;color:#fff}
.pad-sub{opacity:.7;font-size:clamp(.8rem,1vw,1.2rem)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
button{border:none;background:#8b31ff;color:#fff;font-family:'Teko',sans-serif;font-size:clamp(1rem,1.8vw,2rem);padding:.5rem;font-weight:700;letter-spacing:.08em;cursor:pointer;min-height:48px;box-shadow:0 0 10px rgba(139,49,255,.45);clip-path:polygon(8% 0,100% 0,100% 80%,92% 100%,0 100%,0 20%)}
button.loop{background:#39ff14;color:#000}
button.off{background:#5e0000}
.sidebar{border:4px solid #39ff14;background:rgba(0,0,0,.45);padding:1rem;overflow:auto}
.sidebar h2{margin-top:0;color:#b84dff;font-size:2rem}
.pack{padding:.5rem;border-bottom:1px solid rgba(57,255,20,.2);font-size:1.2rem}
.log{height:30vh;overflow:auto;background:#050505;padding:.5rem;border:2px solid #222}
footer{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;font-size:clamp(1rem,1.5vw,1.6rem);border-top:3px solid #39ff14;background:#000}
footer a{color:#39ff14;text-decoration:none}
@media(max-width:980px){.main{grid-template-columns:1fr}.sidebar{height:260px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<div class='logo'>CHOKE</div>
<div class='status'>
<div>BPM 128</div>
<div>GLOBAL CHOKE</div>
<div>DYNAMIC PACKS</div>
</div>
</header>
<div class='waveform'></div>
<section class='main'>
<div class='grid' id='grid'></div>
<aside class='sidebar'>
<h2>PACKS</h2>
<div class='pack'>cyberpilot/</div>
<div class='pack'>deep-dark-pit/</div>
<div class='pack'>friday/</div>
<div class='pack'>low/</div>
<div class='pack'>machine/</div>
<div class='pack'>machine-demo/</div>
<div class='pack'>transitions5/</div>
<h2>SYSTEM</h2>
<div class='log' id='log'>CHOKE initialized.<br>Dynamic pack architecture armed.<br>Awaiting imported audio payloads.<br></div>
</aside>
</section>
<footer>
<div>CHOKE — PERFORMANCE CONTROL SURFACE</div>
<a href='https://bearicide.github.io' target='_blank'>bearicide.github.io</a>
</footer>
<script>
const grid=document.getElementById('grid');
const log=document.getElementById('log');
const pads=[];
const names=['LOAD','SLAM','GLITCH','VOID','BASS','SYNTH','VOICE','STATIC','CHOP','REVERSE','TAPE','FREEZE','CHOKE','PANIC','BURN','OVERLOAD'];
const keys=['q','w','e','r','a','s','d','f','z','x','c','v','1','2','3','4'];
let audioCtx;
let master;
let activeNodes=[];
function writeLog(msg){log.innerHTML+=msg+'<br>';log.scrollTop=log.scrollHeight}
function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.35;master.connect(audioCtx.destination)}
function chokeAll(){activeNodes.forEach(n=>{try{n.stop()}catch(e){}});activeNodes=[];writeLog('GLOBAL CHOKE EXECUTED')}
function hitPad(i){initAudio();audioCtx.resume();chokeAll();const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.frequency.value=70+(i*40);osc.type=i%2?'square':'sawtooth';gain.gain.setValueAtTime(.45,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);osc.connect(gain);gain.connect(master);osc.start();osc.stop(audioCtx.currentTime+.18);activeNodes.push(osc);pads[i].classList.add('active');setTimeout(()=>pads[i].classList.remove('active'),120);writeLog('PAD '+(i+1)+' FIRED')}
for(let i=0;i<16;i++){
const pad=document.createElement('div');
pad.className='pad';
pad.innerHTML=`<div><div class='pad-title'>${keys[i].toUpperCase()} · ${names[i]}</div><div class='pad-sub'>dynamic asset routing</div></div><div class='controls'><button>ON</button><button class='loop'>LOOP</button><button>TEST</button><button class='off'>OFF</button></div>`;
pad.addEventListener('pointerdown',e=>{e.preventDefault();hitPad(i)});
grid.appendChild(pad);pads.push(pad)}
document.addEventListener('keydown',e=>{const idx=keys.indexOf(e.key.toLowerCase());if(idx>-1)hitPad(idx);if(e.code==='Space'){e.preventDefault();chokeAll()}});
document.addEventListener('pointerdown',initAudio,{once:true});
</script>
</body>
</html>
