<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOKE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#040404;color:#7dff9d;font-family:Bahnschrift,Arial,sans-serif;background-image:radial-gradient(circle at top,#12341e,#020202 60%)}header{padding:18px 22px;background:#000;border-bottom:4px solid #1aff73}h1{margin:0;font-size:3.5rem;text-shadow:0 0 12px #1aff73}#toolbar{display:flex;gap:14px;flex-wrap:wrap;padding:16px;background:#07110b;border-bottom:2px solid #123}button,label,input,select{padding:16px 18px;background:linear-gradient(180deg,#101d14,#08110b);color:#7dff9d;border:2px solid #1aff73;border-radius:16px;font-weight:800}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:22px}.pad{position:relative;background:linear-gradient(180deg,#101712,#09100c);border:3px solid #1aff73;border-radius:28px;padding:20px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;transition:.12s}.pad.active{border-color:#ff3355}.pad.looping{border-color:#8a2eff;box-shadow:0 0 24px rgba(138,46,255,.45)}.pad.loaded{border-color:#59f3ff}.pad.choked{border-color:#ff003c}.pad.empty{opacity:.55}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}.controls button{padding:16px;border:none;border-radius:14px}.trig{background:#1aff73;color:#000}.loop{background:#8a2eff;color:#fff}.stop{background:#8b1026;color:#fff}.wave{height:58px;background:#041008;border-radius:12px;margin-top:14px;border:1px solid rgba(0,255,120,.2)}.status{margin-top:10px}.quantRow{margin-top:12px;display:flex;gap:10px}@media(max-width:1100px){#grid{grid-template-columns:repeat(2,1fr)}h1{font-size:2.2rem}}</style>
</head>
<body>
<header><h1>CHOKE</h1></header>
<div id='toolbar'><button id='panic'>PANIC</button><label for='audio'>IMPORT AUDIO</label><input id='audio' type='file' accept='audio/*'><input id='bpm' type='number' value='120' min='40' max='240'><select id='quant'><option value='1'>1 BAR</option><option value='0.5'>1/2 BAR</option><option value='0.25'>1/4 BAR</option><option value='0.125'>1/8 BAR</option></select></div>
<div id='grid'></div>
<script>
const grid=document.getElementById('grid');
const pads=[];
let audioCtx=null;
let quantValue=.25;
document.getElementById('quant').onchange=e=>quantValue=parseFloat(e.target.value);
function audio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}audioCtx.resume();return audioCtx;}
function stopSource(src){try{if(src)src.stop();}catch(e){}}
function hardChoke(activeIndex){pads.forEach((p,i)=>{if(i!==activeIndex){stopSource(p.one);stopSource(p.loop);p.one=null;p.loop=null;p.el.classList.remove('active','looping');if(p.buffer){p.el.classList.add('choked');setTimeout(()=>p.el.classList.remove('choked'),120);}}});}
function quantizedStart(fn){const bpm=parseFloat(document.getElementById('bpm').value)||120;const beat=(60/bpm)*4*quantValue;setTimeout(fn,beat*1000);}
function play(index,loopMode){const ctx=audio();const p=pads[index];if(!p.buffer)return;if(loopMode&&p.loop){stopSource(p.loop);p.loop=null;p.el.classList.remove('looping');return;}hardChoke(index);stopSource(p.one);if(loopMode)stopSource(p.loop);quantizedStart(()=>{const src=ctx.createBufferSource();const gain=ctx.createGain();src.buffer=p.buffer;src.loop=loopMode;src.connect(gain).connect(ctx.destination);src.start();if(loopMode){p.loop=src;p.el.classList.add('looping');}else{p.one=src;p.el.classList.add('active');setTimeout(()=>p.el.classList.remove('active'),140);}});}
function makePads(){grid.innerHTML='';pads.length=0;for(let i=0;i<16;i++){const el=document.createElement('div');el.className='pad empty';el.innerHTML='<div><strong>PAD '+(i+1)+'</strong><div class=status>EMPTY</div><div class=wave></div><div class=quantRow><select class=length><option value=1>1X</option><option value=2>2X</option><option value=4>4X</option><option value=8>8X</option></select></div></div><div class=controls><button class=trig>TRIG</button><button class=loop>LOOP</button><button class=stop>STOP</button></div>';grid.appendChild(el);const state={el,buffer:null,one:null,loop:null,length:1,status:el.querySelector('.status')};pads.push(state);el.querySelector('.length').onchange=e=>state.length=parseInt(e.target.value);el.querySelector('.trig').onclick=()=>play(i,false);el.querySelector('.loop').onclick=()=>play(i,true);el.querySelector('.stop').onclick=()=>{stopSource(state.one);stopSource(state.loop);state.one=null;state.loop=null;el.classList.remove('active','looping');};}}
async function importAudio(file){const ctx=audio();const data=await file.arrayBuffer();const decoded=await ctx.decodeAudioData(data);const frames=Math.floor(decoded.length/16);for(let i=0;i<16;i++){const mult=pads[i].length||1;const slice=ctx.createBuffer(decoded.numberOfChannels,frames*mult,decoded.sampleRate);for(let ch=0;ch<decoded.numberOfChannels;ch++){const src=decoded.getChannelData(ch);const dst=slice.getChannelData(ch);const start=i*frames;for(let j=0;j<frames*mult;j++)dst[j]=src[start+j]||0;}pads[i].buffer=slice;pads[i].status.textContent='SLICE '+(i+1)+' READY';pads[i].el.classList.remove('empty');pads[i].el.classList.add('loaded');}}
document.getElementById('audio').onchange=e=>{const file=e.target.files[0];if(file)importAudio(file);};
document.getElementById('panic').onclick=()=>pads.forEach(p=>{stopSource(p.one);stopSource(p.loop);p.one=null;p.loop=null;p.el.classList.remove('active','looping','choked');});
makePads();
</script>
</body>
</html>
