<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE</title><style>body{margin:0;background:#050005;color:#39ff14;font-family:Arial,sans-serif}header,footer{padding:10px;border-bottom:2px solid #39ff14}footer{border-top:2px solid #39ff14;border-bottom:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}.pad{background:#180018;border:3px solid #39ff14;padding:12px;min-height:120px}.pad.active{border-color:#ff3c58;background:#320028}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}button{padding:10px;background:#933dff;color:#fff;border:none}.green{background:#39ff14;color:#000}.red{background:#7a0000}.panel{padding:10px;border-top:2px solid #39ff14}.vu{height:14px;background:linear-gradient(90deg,#39ff14,#ff3c58);margin:4px 0}.overlord{display:none;padding:10px;border-top:2px solid #933dff}.overlord.open{display:block}</style></head><body><header><h1>CHOKE</h1><div>BPM 128 / GLOBAL CHOKE / DYNAMIC PACKS</div></header><div class='panel'><div>MASTER<div class='vu'></div></div><div>CPU<div class='vu' style='width:35%'></div></div><button id='hammer'>IMPACT HAMMER</button><button class='red' id='panic'>PANIC</button><button id='adminBtn'>OVERLORD</button></div><div id='grid'></div><div class='overlord' id='overlord'><h2>OVERLORD</h2><div>Latency Debug</div><div>Touch Safe Mode</div><div>Pack Routing</div><div>Visual Intensity</div></div><footer>bearicide.github.io</footer><script>const grid=document.getElementById('grid');const pads=[];const names=['LOAD','SLAM','GLITCH','VOID','BASS','SYNTH','VOICE','STATIC','CHOP','REVERSE','TAPE','FREEZE','CHOKE','PANIC','BURN','OVERLOAD'];const keys=['q','w','e','r','a','s','d','f','z','x','c','v','1','2','3','4'];let audioCtx,master,hammer=false,active=[];function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.connect(audioCtx.destination)}function choke(){active.forEach(a=>{try{a.stop()}catch(e){}});active=[]}function hit(i){init();audioCtx.resume();choke();const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=hammer?'sawtooth':'square';osc.frequency.value=80+(i*40);gain.gain.value=hammer?.6:.3;osc.connect(gain);gain.connect(master);osc.start();osc.stop(audioCtx.currentTime+.2);active.push(osc);pads[i].classList.add('active');setTimeout(()=>pads[i].classList.remove('active'),120)}for(let i=0;i<16;i++){const p=document.createElement('div');p.className='pad';p.innerHTML='<div>'+keys[i].toUpperCase()+' · '+names[i]+'</div><div class=controls><button>ON</button><button class=green>LOOP</button><button>TEST</button><button class=red>OFF</button></div>';p.addEventListener('pointerdown',()=>hit(i));grid.appendChild(p);pads.push(p)}document.addEventListener('keydown',e=>{const idx=keys.indexOf(e.key.toLowerCase());if(idx>-1)hit(idx);if(e.code==='Space')choke()});document.getElementById('hammer').onclick=()=>hammer=!hammer;document.getElementById('panic').onclick=()=>choke();document.getElementById('adminBtn').onclick=()=>document.getElementById('overlord').classList.toggle('open');</script></body></html>
