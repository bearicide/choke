<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CHOKE // OVERLORD</title><style>*{box-sizing:border-box}body{margin:0;color:#65ff8f;font-family:Bahnschrift,Arial,sans-serif;overflow:hidden;background:#030303;background-image:radial-gradient(circle at top,#0f331d,#020202 60%)}body:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,120,.03) 0px,rgba(0,255,120,.03) 1px,transparent 2px,transparent 4px);pointer-events:none}header{padding:18px 24px;border-bottom:3px solid #1aff73;background:rgba(0,0,0,.9)}header h1{margin:0;font-size:3.5rem;letter-spacing:.25rem;text-shadow:0 0 12px #1aff73}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:16px;background:#07110b;border-bottom:2px solid #123}.toolbar button,.importLabel,.toolbar input{background:#08110b;border:2px solid #1aff73;color:#65ff8f;padding:16px 20px;border-radius:16px;font-weight:900}.toolbar input{width:90px}.panic{border-color:#ff3355;color:#ff6688}.iconbar{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:12px;background:#071009;border-bottom:2px solid #123}.iconTile{background:linear-gradient(180deg,#101d14,#08100b);border:2px solid #1aff73;border-radius:18px;padding:10px;text-align:center;box-shadow:0 0 18px rgba(0,255,120,.08)}.glyph{font-size:2rem;display:block;text-shadow:0 0 10px #1aff73}.label{font-size:.68rem;letter-spacing:.08rem;opacity:.8;margin-top:4px}input[type=file]{display:none}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:22px;height:calc(100vh - 360px);overflow:auto}.pad{background:linear-gradient(180deg,#0f1612,#09100c);border:3px solid #1aff73;border-radius:28px;padding:20px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 24px rgba(0,255,120,.08)}.pad.active{border-color:#ff3355}.pad.looping{border-color:#9d4dff}.pad.queued{border-color:#59f3ff}.pad.choked{border-color:#ff003c;box-shadow:0 0 28px rgba(255,0,60,.55)}.padHeader strong{font-size:1.5rem}.sliceInfo{opacity:.75;margin-top:8px}.wave{height:50px;border-radius:10px;margin-top:12px;background:#041008;border:1px solid rgba(0,255,120,.2);position:relative;overflow:hidden}.wavebar{position:absolute;bottom:0;width:4px;background:#1aff73;opacity:.75}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.controls button{padding:18px;border:none;border-radius:14px;font-weight:900}.triggerBtn{background:#1aff73;color:#00150a}.loopBtn{background:#8a2eff;color:white}.queueBtn{background:#59f3ff;color:#001118}.stopBtn{background:#8b1026;color:white}footer{padding:14px;text-align:center;border-top:2px solid #1aff73;background:#000}@media(max-width:900px){.iconbar{grid-template-columns:repeat(4,1fr)}#grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:2.2rem}}</style></head><body><header><h1>CHOKE</h1></header><div class='toolbar'><button id='quantBtn'>1/16</button><input id='bpmInput' type='number' min='40' max='240' value='120'><button id='chokeToggle'>FULL CHOKE: ON</button><button class='panic' id='panicBtn'>PANIC</button><label class='importLabel' for='audioImport'>IMPORT + SLICE</label><input id='audioImport' type='file' accept='audio/*'></div><div class='iconbar'><div class='iconTile'><span class='glyph'>⚡</span><div class='label'>POWER</div></div><div class='iconTile'><span class='glyph'>🛡</span><div class='label'>SECURITY</div></div><div class='iconTile'><span class='glyph'>◉</span><div class='label'>MONITOR</div></div><div class='iconTile'><span class='glyph'>⌘</span><div class='label'>CONTROL</div></div><div class='iconTile'><span class='glyph'>⬆</span><div class='label'>UPLOAD</div></div><div class='iconTile'><span class='glyph'>⬇</span><div class='label'>DOWNLOAD</div></div><div class='iconTile'><span class='glyph'>⌬</span><div class='label'>NETWORK</div></div><div class='iconTile'><span class='glyph'>⚙</span><div class='label'>SYSTEM</div></div></div><div id='grid'></div><footer>MATTBEAR // OVERLORD INTERFACE</footer><script>document.getElementById('panicBtn').onclick=()=>location.reload()</script></body></html>
